name: "✨ 기능"
description: 새 기능을 만들 때
title: "feat: "
labels: ["feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 작업 설명
      description: 무엇을 왜 만드는지, PRD의 어느 절인지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: 수용 조건 (AC)
      description: PRD의 AC 번호와 문장을 그대로 옮겨 주세요.
      value: |
        - [ ] AC-
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: 브랜치 이름
      placeholder: feat/session-form
  - type: textarea
    id: out
    attributes:
      label: 이번에 하지 않는 것
